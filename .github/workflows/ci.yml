name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run Jest unit tests
        run: |
          cd backend
          npm test

      - name: Upload backend test log
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-log
          path: backend
          if-no-files-found: ignore

  python-tests:
    name: Python Test Suites
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium locust

      - name: Run validation tests
        run: |
          pytest tests/validation/test_validation.py --junitxml=reports/validation.xml

      - name: Run Appium test placeholder
        run: |
          mkdir -p reports
          if [ -d tests/appium ]; then
            pytest tests/appium --junitxml=reports/appium.xml
          else
            echo "No Appium tests found; generating placeholder report."
            cat > reports/appium.xml <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<testsuite name="Appium" tests="0" skipped="1">
</testsuite>
EOF
          fi

      - name: Upload Python test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: reports
          if-no-files-found: ignore

  selenium-e2e:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          npm ci
          cd ../frontend
          npm ci
          python -m pip install --upgrade pip
          pip install pytest selenium locust

      - name: Start backend server
        run: |
          cd backend
          PORT=5000 ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5000 node server.js > ../backend-server.log 2>&1 &
          echo $! > ../backend.pid

      - name: Start frontend server
        run: |
          cd frontend
          npm run dev -- --host 0.0.0.0 --port 5173 > ../frontend-server.log 2>&1 &
          echo $! > ../frontend.pid

      - name: Wait for services
        run: |
          npm install -g wait-on
          wait-on http://localhost:5000
          wait-on http://localhost:5173

      - name: Run Selenium E2E suite
        run: |
          pytest tests/e2e/test_e2e_full.py --junitxml=reports/selenium.xml

      - name: Run Locust load test
        run: |
          mkdir -p reports
          locust -f tests/load/locustfile.py --headless -u 2 -r 1 -t 15s --host=http://localhost:5000 --only-summary --csv=reports/locust

      - name: Upload Selenium and load artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-load-reports
          path: |
            reports
            backend-server.log
            frontend-server.log
          if-no-files-found: ignore

      - name: Tear down servers
        if: always()
        run: |
          if [ -f backend.pid ]; then kill $(cat backend.pid) || true; fi
          if [ -f frontend.pid ]; then kill $(cat frontend.pid) || true; fi
